# flutter-ship: builds the iOS app on a macOS runner and uploads it to TestFlight.
# Started by `bundle exec fastlane ios release` on Windows/Linux, or by hand from the Actions tab.
#
# Repository secrets (the ship-init skill sets them):
#   SHIP_VAULT_PASSWORD      vault passphrase
#   SHIP_VAULT_DEPLOY_KEY    SSH deploy key of the vault repo (write: renewing a profile pushes it)
#
# Repository variable (optional):
#   IOS_RUNNER               where the job runs, as JSON. Unset: GitHub's macos-26 (billed minutes).
#                            '["self-hosted","macOS","flutter-ship"]': the owner's own Mac, set up by
#                            flutter-ship's scripts/mac-runner.sh (free, but the Mac must be on).
#
# The vault repo below is the app's vault: the owner's ship-vault, or the client's own vault
# when ship.yml has `vault:` (it must match vault.repo there).
name: iOS release

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'release (TestFlight) or build (signed .ipa only)'
        type: choice
        options: [release, build]
        default: release

permissions:
  contents: write # pushes the ios/<version> tag

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    # App Store Connect only takes builds from the current Xcode (iOS 26 SDK since 2026).
    runs-on: ${{ fromJSON(vars.IOS_RUNNER || '"macos-26"') }}
    timeout-minutes: 60
    env:
      # Commit identity for the ios/<version> tag and vault pushes. Env, not `git config --global`,
      # so a self-hosted Mac keeps its owner's own git identity.
      GIT_AUTHOR_NAME: flutter-ship CI
      GIT_AUTHOR_EMAIL: ci@users.noreply.github.com
      GIT_COMMITTER_NAME: flutter-ship CI
      GIT_COMMITTER_EMAIL: ci@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4

      # A self-hosted Mac uses the Xcode selected on it (xcode-select needs sudo there).
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.environment == 'github-hosted'
        with:
          xcode-version: latest-stable

      - name: Checkout flutter-ship lanes
        uses: actions/checkout@v4
        with:
          repository: Yukisando/flutter-ship
          path: .ship/lanes

      - name: Checkout the vault
        uses: actions/checkout@v4
        with:
          repository: Yukisando/ship-vault
          path: .ship/vault
          ssh-key: ${{ secrets.SHIP_VAULT_DEPLOY_KEY }}

      - name: Machine config
        run: |
          mkdir -p ~/.ship
          # Owner name and contact; a client vault may have none (ship.yml owner_name covers it).
          cp .ship/vault/config.yml ~/.ship/config.yml 2>/dev/null || true
          xcodebuild -version

      - name: Flutter version from the repo
        id: flutter
        run: echo "version=$(cat .flutter-version 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - uses: ruby/setup-ruby@v1
        if: runner.environment == 'github-hosted'
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # On the Mac: Homebrew's Ruby, gems kept outside the workspace (checkout wipes it).
      - name: Ruby gems (self-hosted Mac)
        if: runner.environment == 'self-hosted'
        run: |
          echo "BUNDLE_PATH=$HOME/.ship/gems/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          BUNDLE_PATH="$HOME/.ship/gems/${GITHUB_REPOSITORY#*/}" bundle install --jobs 4

      - name: fastlane ios ${{ inputs.lane }}
        run: bundle exec fastlane ios ${{ inputs.lane }}
        env:
          SHIP_LOCAL: ${{ github.workspace }}/.ship/lanes
          SHIP_VAULT_DIR: ${{ github.workspace }}/.ship/vault
          SHIP_VAULT_PASSWORD: ${{ secrets.SHIP_VAULT_PASSWORD }}

      - name: Keep the .ipa
        if: inputs.lane == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7
