// flutter-ship: release signing from the encrypted vault (Groovy build.gradle variant).
// In android/app/build.gradle, inside `android { ... }`:

    signingConfigs {
        if (System.getenv("SHIP_KEYSTORE_PATH")) {
            release {
                storeFile file(System.getenv("SHIP_KEYSTORE_PATH"))
                storePassword System.getenv("SHIP_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SHIP_KEY_ALIAS")
                keyPassword System.getenv("SHIP_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.findByName("release") ?: signingConfigs.debug
        }
    }
