# Compiles, signs and uploads a Unity Xcode export to TestFlight on a macOS runner.
# flutter-ship template for Unity apps. Started by `bundle exec fastlane ios unity_release` on Windows/Linux:
# Unity writes build/iOS, the lane zips it onto a draft release and passes the tag here.
#
# Repository secrets:
#   SHIP_VAULT_PASSWORD      vault passphrase
#   SHIP_VAULT_DEPLOY_KEY    SSH deploy key of Yukisando/ship-vault (read-only is enough here)
#
# Repository variable (optional):
#   IOS_RUNNER               where the job runs, as JSON. Unset: GitHub's macos-26 (billed minutes).
#                            '["self-hosted","macOS","flutter-ship"]': the owner's own Mac, set up by
#                            flutter-ship's scripts/mac-runner.sh (free, but the Mac must be on).
name: iOS release

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Draft release tag holding the zipped Xcode export (ios-xcode/<version>+<build>)'
        required: true

permissions:
  contents: write # reads the draft release, deletes it once uploaded

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    # App Store Connect only takes builds from the current Xcode (iOS 26 SDK since 2026)
    runs-on: ${{ fromJSON(vars.IOS_RUNNER || '"macos-26"') }}
    timeout-minutes: 90
    env:
      # Commit identity by env, not `git config --global`, so a self-hosted Mac keeps its owner's.
      GIT_AUTHOR_NAME: flutter-ship CI
      GIT_AUTHOR_EMAIL: ci@users.noreply.github.com
      GIT_COMMITTER_NAME: flutter-ship CI
      GIT_COMMITTER_EMAIL: ci@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # A self-hosted Mac uses the Xcode selected on it (xcode-select needs sudo there).
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.environment == 'github-hosted'
        with:
          xcode-version: latest-stable

      - name: Download the Xcode export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/iOS
          gh release download "${{ inputs.release }}" -R "${{ github.repository }}" -p '*.zip' -D "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP"/*.zip -d build/iOS
          chmod +x build/iOS/*.sh build/iOS/**/*.sh 2>/dev/null || true

      - name: Checkout flutter-ship lanes
        uses: actions/checkout@v4
        with:
          repository: Yukisando/flutter-ship
          path: .ship/lanes

      - name: Checkout the vault
        uses: actions/checkout@v4
        with:
          repository: Yukisando/ship-vault
          path: .ship/vault
          ssh-key: ${{ secrets.SHIP_VAULT_DEPLOY_KEY }}

      - name: Machine config
        run: |
          mkdir -p ~/.ship
          cp .ship/vault/config.yml ~/.ship/config.yml 2>/dev/null || true
          xcodebuild -version

      - uses: ruby/setup-ruby@v1
        if: runner.environment == 'github-hosted'
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # On the Mac: Homebrew's Ruby, gems kept outside the workspace (checkout wipes it).
      - name: Ruby gems (self-hosted Mac)
        if: runner.environment == 'self-hosted'
        run: |
          echo "BUNDLE_PATH=$HOME/.ship/gems/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          BUNDLE_PATH="$HOME/.ship/gems/${GITHUB_REPOSITORY#*/}" bundle install --jobs 4

      # A Mac keeps its CocoaPods specs cache between runs; a stale one fails pod install.
      - name: Refresh CocoaPods specs (self-hosted Mac)
        if: runner.environment == 'self-hosted' && hashFiles('build/iOS/Podfile') != ''
        run: pod repo update --silent

      - name: fastlane ios unity_release
        run: bundle exec fastlane ios unity_release xcode:build/iOS
        env:
          SHIP_LOCAL: ${{ github.workspace }}/.ship/lanes
          SHIP_VAULT_DIR: ${{ github.workspace }}/.ship/vault
          SHIP_VAULT_PASSWORD: ${{ secrets.SHIP_VAULT_PASSWORD }}

      - name: Drop the draft release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        # A draft release has no git tag behind it, so there is no tag to clean up
        run: gh release delete "${{ inputs.release }}" -R "${{ github.repository }}" --yes
